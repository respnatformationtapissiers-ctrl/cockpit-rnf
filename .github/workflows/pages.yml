name: Deploy Cockpit RNF

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Stock CFA tile into cockpit home
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          athena = '<button onclick="toggleAthena()"><span>A</span><b>Athéna</b></button>'
          stock = '<button onclick="open(\'https://docs.google.com/spreadsheets/d/1xk117VgTqn1DrLXwZocTwLzudUaIwsGLVlK439uywxg/edit#gid=2034337610\')"><span>📦</span><b>Stock CFA</b><div class="muted small">Carcasses · QR · photos</div></button>'

          if '<b>Stock CFA</b>' not in html:
              if athena not in html:
                  raise SystemExit('Tuile Athéna introuvable : injection Stock CFA impossible')
              html = html.replace(athena, stock + athena, 1)

          html = html.replace('v0.15 web', 'v0.16 web')
          html = html.replace('v0.15 web : suivi de budget BTM en lecture de synthèse.', 'v0.16 web : suivi de budget BTM + accès Stock CFA.')
          p.write_text(html, encoding='utf-8')

          if '<b>Stock CFA</b>' not in p.read_text(encoding='utf-8'):
              raise SystemExit('Échec de vérification : tuile Stock CFA absente du fichier déployé')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
